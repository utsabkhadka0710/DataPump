[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = 'datadump'
version = '0.1.0'
description = "An Data Dump project that processes CSV files."
readme = 'README.md'
license = {text='MIT'}

dependencies = [
    'fastapi[standard]',
    'uvicorn[standard]',
    'pydantic',
]
